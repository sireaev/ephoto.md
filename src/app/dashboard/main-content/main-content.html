<main class="main-content">
    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title">Bord</h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a [routerLink]="'/'+adminPath">Acasă</a></li>
                    <li class="breadcrumb-item active">Bord</li>
                </ol>
            </nav>
        </div>
        <div class="page-header-actions">
            <button class="btn-outline-nebula gap-2">
                <i class="far fa-file-excel"></i>Export
            </button>
            <button class="btn-nebula gap-2">
                <i class="fas fa-plus"></i>Add Widget
            </button>
        </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid">
        <div class="kpi-card" *ngFor="let kpi of kpis()">
            <div class="kpi-icon" [ngStyle]="{'background': kpi.bg, 'color': kpi.color}">
                <i class="bi" [ngClass]="kpi.icon"></i>
            </div>
            <div class="kpi-body">
                <span class="kpi-label">{{ kpi.label }}</span>
                <span class="kpi-value">{{ kpi.value }}</span>
                <span class="kpi-change" [ngClass]="kpi.trend > 0 ? 'up' : 'down'">
                    <i class="bi" [ngClass]="kpi.trend > 0 ? 'bi-arrow-up-short' : 'bi-arrow-down-short'"></i>
                    {{ kpi.change }}
                </span>
            </div>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="content-row">
        <!-- Bar Chart Placeholder -->
        <div class="card-nebula flex-2">
            <div class="card-header-nebula">
                <h5 class="card-title-nebula">Vizitatori unici</h5>
                <div class="card-actions">
                    <button class="chip"
                    (click)="view.set('monthly')"
                    [class.active]="view() === 'monthly'"
                    >Lunar</button>
                    <button class="chip"
                    (click)="view.set('weekly')"
                    [class.active]="view() === 'weekly'"
                    >Saptămânal</button>
                    <button class="chip"
                    (click)="view.set('daily')"
                    [class.active]="view() === 'daily'"
                    >Zilnic</button>
                </div>
            </div>
            <div class="chart-area">
                <highcharts-chart
                    class="bar-chart"
                    [options]="chartOptions()"
                />
            </div>
        </div>

        <!-- Donut Chart -->
        <div class="card-nebula flex-1">
            <div class="card-header-nebula">
                <h5 class="card-title-nebula">Trafic pe dispozitive</h5>
            </div>
            <div class="chart-area">
                <highcharts-chart
                    class="donut-chart"
                    [options]="donutChartOptions()"
                />
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card-nebula">
        <div class="card-header-nebula">
            <h5 class="card-title-nebula">Recent Transactions</h5>
            <a href="#" class="view-all">View all</a>
        </div>
        <div class="table-wrapper">
            <table class="nebula-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let t of transactions">
                        <td class="text-muted">{{ t.id }}</td>
                        <td>
                            <div class="table-user">
                                <img [src]="t.avatar" class="table-avatar" />
                                <span>{{ t.customer }}</span>
                            </div>
                        </td>
                        <td>{{ t.product }}</td>
                        <td class="text-muted">{{ t.date }}</td>
                        <td class="fw-semibold">{{ t.amount }}</td>
                        <td>
                            <span class="status-badge" [ngClass]="t.status">{{ t.statusLabel }}</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
