<div class="modal-body">
  <div class="close-btn" (click)="close()">&times;</div>

  <owl-carousel-o
    [options]="carouselOptions">

    @for (image of images; track i; let i = $index) {
      <ng-template carouselSlide [id]="i.toString()">
        <div class="slide">
          <img
            [src]="image"
            alt="Preview image"
            draggable="false" />
        </div>
      </ng-template>
    }

  </owl-carousel-o>
</div>
